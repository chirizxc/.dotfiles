"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """\
$directory\
$git_branch\
$python$rust$zig$go$c\
$line_break\
$character\
"""

palette = "colors"

[palettes.colors]
green = "#98971a"
blue = "#1E4261"
bright_green = "#b8bb26"

[character]
disabled = false
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

[line_break]
disabled = false
